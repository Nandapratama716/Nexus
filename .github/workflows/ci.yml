name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Go Core Service Tests
  # ---------------------------------------------------------------------------
  test-go:
    name: Test Go Core Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/core/go.sum

      - name: Run Go Unit Tests
        run: |
          cd backend/core
          go test ./... -v -count=1

  # ---------------------------------------------------------------------------
  # 2. Python AI Service Tests
  # ---------------------------------------------------------------------------
  test-python:
    name: Test Python AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/ai/requirements.txt

      - name: Install dependencies
        run: |
          cd backend/ai
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Python Pytest Suite
        run: |
          cd backend/ai
          python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # 3. Next.js Admin Dashboard Build Validation
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Validate Next.js Frontend Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://nexus_db:nexus_pass@localhost:5432/nexus?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd frontend
          npx prisma generate

      - name: Build Next.js Application
        run: |
          cd frontend
          npm run build
