services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgBouncer: Connection Pooler proxy untuk horizontal scaling multi-instance Go
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nexus-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opsional: GUI untuk lihat isi database lewat browser
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  # Phase 4.1: Automated PostgreSQL Backup — daily/weekly/monthly retention
  pg-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: nexus-pg-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SCHEDULE: "@daily"            # Backup setiap hari jam 02:00 UTC
      BACKUP_KEEP_DAYS: "7"         # Simpan 7 backup harian terakhir
      BACKUP_KEEP_WEEKS: "4"        # Simpan 4 backup mingguan terakhir
      BACKUP_KEEP_MONTHS: "3"       # Simpan 3 backup bulanan terakhir
      POSTGRES_EXTRA_OPTS: "-Z9"    # gzip level 9 (kompresi maksimal)
    volumes:
      - nexus_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ls /backups/last* 2>/dev/null || exit 0"]
      interval: 1h
      timeout: 10s
      retries: 1

volumes:
  nexus_postgres_data:
  nexus_redis_data:
  nexus_backups: